<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Stock Retest Scanner — Daily Reports</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --pass: #3fb950;
    --fail: #f85149;
    --warn: #d29922;
    --card: #1c2128;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    padding: 20px 24px 8px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #12181f 0%, var(--bg) 100%);
  }
  header h1 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  label { color: var(--muted); font-size: 0.8rem; display: flex; flex-direction: column; gap: 4px; }
  select, input[type="search"], input[type="text"] {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    min-width: 160px;
    font-size: 0.9rem;
  }
  input[type="search"] { min-width: 220px; }
  main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 1.75rem; font-weight: 700; margin-top: 4px; }
  .card.pass .value { color: var(--pass); }
  .card.fail .value { color: var(--fail); }
  .card.warn .value { color: var(--warn); }
  .charts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .chart-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    min-height: 260px;
  }
  .chart-box h2 { margin: 0 0 10px; font-size: 0.95rem; color: var(--muted); font-weight: 600; }
  .chart-wrap { position: relative; height: 210px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
    margin-bottom: 10px;
  }
  .table-wrap {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    max-height: 70vh;
  }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td {
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    white-space: nowrap;
  }
  th {
    background: #1c2128;
    position: sticky; top: 0;
    cursor: pointer;
    user-select: none;
    z-index: 1;
  }
  th:hover { color: var(--accent); }
  th .sort { color: var(--accent); margin-left: 4px; font-size: 0.7rem; }
  tr.pass { background: rgba(63, 185, 80, 0.08); }
  tr.fail { background: transparent; }
  tr:hover { background: rgba(88, 166, 255, 0.08); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 650;
  }
  .pill.pass { background: rgba(63,185,80,0.2); color: var(--pass); }
  .pill.fail { background: rgba(248,81,73,0.2); color: var(--fail); }
  .err { color: var(--fail); padding: 12px; }
  footer { color: var(--muted); font-size: 0.8rem; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <h1>Stock Retest Scanner</h1>
  <div class="sub">Full FinViz universe daily report · Asia/Jerusalem · no live orders</div>
  <div class="controls">
    <label>Report date
      <select id="reportSelect"></select>
    </label>
    <label>Status
      <select id="statusFilter">
        <option value="ALL">All</option>
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </label>
    <label>Search
      <input type="search" id="searchBox" placeholder="Ticker or reason…"/>
    </label>
  </div>
</header>
<main>
  <div class="cards">
    <div class="card"><div class="label">Scanned</div><div class="value" id="cScanned">—</div></div>
    <div class="card pass"><div class="label">PASS</div><div class="value" id="cPass">—</div></div>
    <div class="card fail"><div class="label">FAIL</div><div class="value" id="cFail">—</div></div>
    <div class="card warn"><div class="label">Earnings blackout</div><div class="value" id="cBlackout">—</div></div>
  </div>

  <div class="charts">
    <div class="chart-box">
      <h2>PASS vs FAIL</h2>
      <div class="chart-wrap"><canvas id="chartStatus"></canvas></div>
    </div>
    <div class="chart-box">
      <h2>FAIL reason buckets</h2>
      <div class="chart-wrap"><canvas id="chartReasons"></canvas></div>
    </div>
    <div class="chart-box">
      <h2>R:R distribution (PASS)</h2>
      <div class="chart-wrap"><canvas id="chartRR"></canvas></div>
    </div>
  </div>

  <div class="toolbar">
    <div style="color:var(--muted);font-size:0.85rem" id="tableMeta">Loading…</div>
  </div>
  <div class="table-wrap">
    <table id="dataTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
  <footer id="footerNote"></footer>
</main>

<script>
const COLS = [
  "ticker","status","current_price","entry","sl","tp","rr",
  "zone_lo","zone_hi","atr","short_float_pct","inst_own_pct",
  "dollar_vol_30d","avg_vol_30d","weekly_bars","days_to_earnings",
  "earnings_known","earnings_blackout","tradingview_url","reason"
];

const NUM_COLS = new Set([
  "current_price","entry","sl","tp","rr","zone_lo","zone_hi","atr",
  "short_float_pct","inst_own_pct","dollar_vol_30d","avg_vol_30d",
  "weekly_bars","days_to_earnings"
]);

let allRows = [];
let sortCol = "rr";
let sortDir = "desc";
let charts = { status: null, reasons: null, rr: null };

function parseCSV(text) {
  const rows = [];
  let i = 0, field = "", row = [], inQ = false;
  while (i < text.length) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
    i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(x => x !== "")).map(r => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = r[idx] !== undefined ? r[idx] : ""; });
    return obj;
  });
}

function toNum(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function bucketReason(reason, status) {
  if (status === "PASS") return null;
  const s = (reason || "").toLowerCase();
  if (s.includes("earnings blackout") || s.includes("earnings")) return "earnings";
  if (s.includes("$vol") || s.includes("dollar vol") || s.includes("vol(30d)")) return "$vol";
  if (s.includes("short float")) return "short float";
  if (s.includes("history") || s.includes("no price") || s.includes("too little") || s.includes("weekly bars")) return "history";
  if (s.includes("r:r") || s.startsWith("r:r")) return "R:R";
  if (s.includes("retest") || s.includes("geometry") || s.includes("no weekly")) return "no retest";
  return "other";
}

function fmt(col, val) {
  if (val === null || val === undefined || val === "") return "";
  if (col === "tradingview_url") {
    return `<a href="${val}" target="_blank" rel="noopener">TV</a>`;
  }
  if (col === "status") {
    const cls = String(val).toUpperCase() === "PASS" ? "pass" : "fail";
    return `<span class="pill ${cls}">${val}</span>`;
  }
  if (col === "earnings_blackout" || col === "earnings_known") {
    const b = String(val).toLowerCase() === "true" || val === true || val === "1";
    return b ? "true" : "false";
  }
  if (NUM_COLS.has(col)) {
    const n = toNum(val);
    if (n === null) return "";
    if (col === "rr") return n.toFixed(3);
    if (col === "dollar_vol_30d") return Math.round(n).toLocaleString();
    if (col === "avg_vol_30d" || col === "weekly_bars" || col === "days_to_earnings") return String(Math.round(n));
    if (col.endsWith("_pct")) return n.toFixed(2);
    return n.toFixed(4);
  }
  return String(val);
}

function compareRows(a, b) {
  const av = a[sortCol], bv = b[sortCol];
  const an = toNum(av), bn = toNum(bv);
  let cmp;
  if (NUM_COLS.has(sortCol)) {
    const aEmpty = an === null, bEmpty = bn === null;
    if (aEmpty && bEmpty) cmp = 0;
    else if (aEmpty) cmp = 1;
    else if (bEmpty) cmp = -1;
    else cmp = an - bn;
  } else {
    cmp = String(av ?? "").localeCompare(String(bv ?? ""));
  }
  // secondary: PASS first when sorting by rr default feel
  if (cmp === 0) {
    const as = a.status === "PASS" ? 0 : 1;
    const bs = b.status === "PASS" ? 0 : 1;
    cmp = as - bs;
  }
  return sortDir === "asc" ? cmp : -cmp;
}

function filteredRows() {
  const st = document.getElementById("statusFilter").value;
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  return allRows.filter(r => {
    if (st !== "ALL" && String(r.status).toUpperCase() !== st) return false;
    if (!q) return true;
    const hay = `${r.ticker || ""} ${r.reason || ""} ${r.status || ""}`.toLowerCase();
    return hay.includes(q);
  });
}

function renderTable() {
  const rows = filteredRows().slice().sort(compareRows);
  const thead = document.querySelector("#dataTable thead");
  const tbody = document.querySelector("#dataTable tbody");
  thead.innerHTML = "<tr>" + COLS.map(c => {
    const mark = sortCol === c ? `<span class="sort">${sortDir === "asc" ? "▲" : "▼"}</span>` : "";
    return `<th data-col="${c}">${c}${mark}</th>`;
  }).join("") + "</tr>";
  tbody.innerHTML = rows.map(r => {
    const cls = String(r.status).toUpperCase() === "PASS" ? "pass" : "fail";
    return `<tr class="${cls}">` + COLS.map(c => `<td>${fmt(c, r[c])}</td>`).join("") + "</tr>";
  }).join("");
  thead.querySelectorAll("th").forEach(th => {
    th.addEventListener("click", () => {
      const c = th.getAttribute("data-col");
      if (sortCol === c) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortCol = c; sortDir = (c === "rr" || NUM_COLS.has(c)) ? "desc" : "asc"; }
      renderTable();
    });
  });
  document.getElementById("tableMeta").textContent =
    `Showing ${rows.length} / ${allRows.length} rows · sort: ${sortCol} ${sortDir}`;
}

function destroyCharts() {
  Object.keys(charts).forEach(k => { if (charts[k]) { charts[k].destroy(); charts[k] = null; } });
}

function renderCharts() {
  destroyCharts();
  const nPass = allRows.filter(r => String(r.status).toUpperCase() === "PASS").length;
  const nFail = allRows.filter(r => String(r.status).toUpperCase() !== "PASS").length;
  const nBo = allRows.filter(r => {
    const v = r.earnings_blackout;
    return String(v).toLowerCase() === "true" || v === true || v === "1";
  }).length;

  document.getElementById("cScanned").textContent = allRows.length;
  document.getElementById("cPass").textContent = nPass;
  document.getElementById("cFail").textContent = nFail;
  document.getElementById("cBlackout").textContent = nBo;

  const statusCtx = document.getElementById("chartStatus");
  charts.status = new Chart(statusCtx, {
    type: "doughnut",
    data: {
      labels: ["PASS", "FAIL"],
      datasets: [{
        data: [nPass, nFail],
        backgroundColor: ["#3fb950", "#f85149"],
        borderWidth: 0
      }]
    },
    options: {
      plugins: { legend: { labels: { color: "#e6edf3" } } },
      maintainAspectRatio: false
    }
  });

  const buckets = {};
  allRows.forEach(r => {
    const b = bucketReason(r.reason, r.status);
    if (!b) return;
    buckets[b] = (buckets[b] || 0) + 1;
  });
  const order = ["$vol", "short float", "history", "R:R", "no retest", "earnings", "other"];
  const labels = order.filter(k => buckets[k]);
  const values = labels.map(k => buckets[k]);
  charts.reasons = new Chart(document.getElementById("chartReasons"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "FAIL count",
        data: values,
        backgroundColor: "#f78166",
        borderRadius: 6
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } },
        y: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" }, beginAtZero: true }
      },
      maintainAspectRatio: false
    }
  });

  const rrVals = allRows
    .filter(r => String(r.status).toUpperCase() === "PASS")
    .map(r => toNum(r.rr))
    .filter(n => n !== null)
    .sort((a,b) => a-b);
  const bins = ["2–2.5","2.5–3","3–4","4+"];
  const counts = [0,0,0,0];
  rrVals.forEach(v => {
    if (v < 2.5) counts[0]++;
    else if (v < 3) counts[1]++;
    else if (v < 4) counts[2]++;
    else counts[3]++;
  });
  charts.rr = new Chart(document.getElementById("chartRR"), {
    type: "bar",
    data: {
      labels: bins,
      datasets: [{
        label: "PASS count",
        data: counts,
        backgroundColor: "#58a6ff",
        borderRadius: 6
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } },
        y: { ticks: { color: "#8b949e", stepSize: 1 }, grid: { color: "#21262d" }, beginAtZero: true }
      },
      maintainAspectRatio: false
    }
  });
}

async function loadReport(path, dateLabel) {
  document.getElementById("tableMeta").textContent = "Loading " + path + "…";
  const res = await fetch(path + "?t=" + Date.now());
  if (!res.ok) throw new Error("Failed to load " + path + " (" + res.status + ")");
  const text = await res.text();
  allRows = parseCSV(text);
  sortCol = "rr";
  sortDir = "desc";
  renderCharts();
  renderTable();
  document.getElementById("footerNote").textContent =
    `Report ${dateLabel} · ${allRows.length} tickers · Chart.js CDN · historical-reports/`;
}

async function init() {
  let reports = [];
  try {
    const res = await fetch("reports.json?t=" + Date.now());
    reports = await res.json();
  } catch (e) {
    reports = [{ date: "latest", file: "latest.csv", path: "historical-reports/latest.csv" }];
  }
  const sel = document.getElementById("reportSelect");
  sel.innerHTML = reports.map((r, i) =>
    `<option value="${r.path}" ${i===0?"selected":""}>${r.date}</option>`
  ).join("");
  // Prefer latest dated entry; also offer latest.csv if present via first dated
  sel.addEventListener("change", () => {
    const opt = sel.selectedOptions[0];
    loadReport(opt.value, opt.textContent).catch(err => {
      document.getElementById("tableMeta").innerHTML = `<span class="err">${err.message}</span>`;
    });
  });
  document.getElementById("statusFilter").addEventListener("change", renderTable);
  document.getElementById("searchBox").addEventListener("input", renderTable);

  const first = reports[0];
  if (first) {
    await loadReport(first.path, first.date);
  } else {
    await loadReport("historical-reports/latest.csv", "latest");
  }
}

init().catch(err => {
  document.getElementById("tableMeta").innerHTML = `<span class="err">${err.message}</span>`;
});
</script>
</body>
</html>
