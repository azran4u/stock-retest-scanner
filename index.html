<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Stock Retest Scanner — Daily Reports</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --pass: #3fb950;
    --fail: #f85149;
    --warn: #d29922;
    --card: #1c2128;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    padding: 20px 24px 8px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #12181f 0%, var(--bg) 100%);
  }
  header h1 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  label { color: var(--muted); font-size: 0.8rem; display: flex; flex-direction: column; gap: 4px; }
  select, input[type="search"], input[type="text"] {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    min-width: 160px;
    font-size: 0.9rem;
  }
  input[type="search"] { min-width: 220px; }
  main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 1.75rem; font-weight: 700; margin-top: 4px; }
  .card.pass .value { color: var(--pass); }
  .card.fail .value { color: var(--fail); }
  .card.warn .value { color: var(--warn); }
  .charts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .chart-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    min-height: 260px;
  }
  .chart-box h2 { margin: 0 0 10px; font-size: 0.95rem; color: var(--muted); font-weight: 600; }
  .chart-wrap { position: relative; height: 210px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
    margin-bottom: 10px;
  }
  .table-wrap {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    max-height: 70vh;
  }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td {
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    white-space: nowrap;
  }
  th {
    background: #1c2128;
    position: sticky; top: 0;
    cursor: pointer;
    user-select: none;
    z-index: 1;
  }
  th:hover { color: var(--accent); }
  th .sort { color: var(--accent); margin-left: 4px; font-size: 0.7rem; }
  tr.pass { background: rgba(63, 185, 80, 0.08); }
  tr.fail { background: transparent; }
  tr:hover { background: rgba(88, 166, 255, 0.08); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 650;
  }
  .pill.pass { background: rgba(63,185,80,0.2); color: var(--pass); }
  .pill.fail { background: rgba(248,81,73,0.2); color: var(--fail); }
  .err { color: var(--fail); padding: 12px; }
  .chart-filter {
    display: inline-flex; align-items: center; gap: 8px;
    background: #21262d; border: 1px solid var(--accent);
    border-radius: 999px; padding: 4px 10px; font-size: 0.85rem;
  }
  .chart-filter button {
    background: transparent; border: 0; color: var(--muted);
    cursor: pointer; font-size: 1rem; line-height: 1;
  }
  .chart-filter button:hover { color: var(--text); }
  canvas { cursor: pointer; }
  footer { color: var(--muted); font-size: 0.8rem; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <h1>Stock Retest Scanner</h1>
  <div class="sub">Full FinViz universe daily report · Asia/Jerusalem · no live orders</div>
  <div class="controls">
    <label>Report date
      <select id="reportSelect"></select>
    </label>
    <label>Status
      <select id="statusFilter">
        <option value="ALL">All</option>
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </label>
    <label>Search
      <input type="search" id="searchBox" placeholder="Ticker or reason…"/>
    </label>
  </div>
</header>
<main>
  <div class="cards">
    <div class="card"><div class="label">Scanned</div><div class="value" id="cScanned">—</div></div>
    <div class="card pass"><div class="label">PASS</div><div class="value" id="cPass">—</div></div>
    <div class="card fail"><div class="label">FAIL</div><div class="value" id="cFail">—</div></div>
    <div class="card warn"><div class="label">Earnings blackout</div><div class="value" id="cBlackout">—</div></div>
  </div>

  <div class="charts">
    <div class="chart-box">
      <h2>PASS vs FAIL</h2>
      <div class="chart-wrap"><canvas id="chartStatus"></canvas></div>
    </div>
    <div class="chart-box">
      <h2>FAIL reason buckets</h2>
      <div class="chart-wrap"><canvas id="chartReasons"></canvas></div>
    </div>
    <div class="chart-box">
      <h2>R:R distribution (PASS)</h2>
      <div class="chart-wrap"><canvas id="chartRR"></canvas></div>
    </div>
  </div>

  <div class="toolbar">
    <div style="color:var(--muted);font-size:0.85rem" id="tableMeta">Loading…</div>
    <div id="chartFilterChip" class="chart-filter" style="display:none">
      <span id="chartFilterLabel"></span>
      <button type="button" id="clearChartFilter" title="Clear chart filter">×</button>
    </div>
  </div>
  <div class="table-wrap">
    <table id="dataTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
  <footer id="footerNote"></footer>
</main>

<script>
const COLS = [
  "ticker","status","current_price","entry","sl","tp","rr","atrs_from_entry",
  "zone_lo","zone_hi","atr","short_float_pct","inst_own_pct",
  "dollar_vol_30d","avg_vol_30d","weekly_bars","earnings_date","days_to_earnings",
  "earnings_known","earnings_blackout","finviz_url","reason"
];

const NUM_COLS = new Set([
  "current_price","entry","sl","tp","rr","atrs_from_entry","zone_lo","zone_hi","atr",
  "short_float_pct","inst_own_pct","dollar_vol_30d","avg_vol_30d",
  "weekly_bars","days_to_earnings"
]);
const EARNINGS_BLACKOUT_DAYS = 14;

let allRows = [];
let sortCol = "rr";
let sortDir = "desc";
let sortCol2 = "atrs_from_entry";
let sortDir2 = "asc";
let charts = { status: null, reasons: null, rr: null };
let chartFilter = null; // { type: 'status'|'reason'|'rr', value: string } | null
const RR_BINS = [
  { label: "2–2.5", min: 2, max: 2.5 },
  { label: "2.5–3", min: 2.5, max: 3 },
  { label: "3–4", min: 3, max: 4 },
  { label: "4+", min: 4, max: Infinity },
];



function todayJerusalemISO() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Jerusalem", year: "numeric", month: "2-digit", day: "2-digit"
  }).format(new Date());
}

function liveDaysToEarnings(earningsDate) {
  if (!earningsDate) return null;
  const ed = String(earningsDate).slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ed)) return null;
  const today = todayJerusalemISO();
  const a = Date.parse(today + "T00:00:00Z");
  const b = Date.parse(ed + "T00:00:00Z");
  if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
  return Math.round((b - a) / 86400000);
}

function enrichEarningsLive(rows) {
  return rows.map(r => {
    const out = Object.assign({}, r);
    const days = liveDaysToEarnings(out.earnings_date);
    if (days !== null) {
      out.days_to_earnings = days;
      out.earnings_known = true;
      out.earnings_blackout = days >= 0 && days < EARNINGS_BLACKOUT_DAYS;
    }
    return out;
  });
}

function parseCSV(text) {
  const rows = [];
  let i = 0, field = "", row = [], inQ = false;
  while (i < text.length) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
    i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(x => x !== "")).map(r => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = r[idx] !== undefined ? r[idx] : ""; });
    return obj;
  });
}

function toNum(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function bucketReason(reason, status) {
  if (status === "PASS") return null;
  const s = (reason || "").toLowerCase();
  if (s.includes("earnings blackout") || s.includes("earnings")) return "earnings";
  if (s.includes("$vol") || s.includes("dollar vol") || s.includes("vol(30d)")) return "$vol";
  if (s.includes("short float")) return "short float";
  if (s.includes("history") || s.includes("no price") || s.includes("too little") || s.includes("weekly bars")) return "history";
  if (s.includes("r:r") || s.startsWith("r:r")) return "R:R";
  if (s.includes("retest") || s.includes("geometry") || s.includes("no weekly")) return "no retest";
  return "other";
}

function fmt(col, val, row) {
  if (col === "earnings_date") return val ? String(val).slice(0, 10) : "";
  if (col === "ticker") {
    const name = val == null ? "" : String(val);
    const tv = row && row.tradingview_url ? row.tradingview_url : "";
    if (tv) return `<a href="${tv}" target="_blank" rel="noopener">${name}</a>`;
    return name;
  }
  if (val === null || val === undefined || val === "") return "";
  if (col === "finviz_url") {
    if (!val) return "";
    return `<a href="${val}" target="_blank" rel="noopener">Finviz</a>`;
  }
  if (col === "tradingview_url") {
    return `<a href="${val}" target="_blank" rel="noopener">TV</a>`;
  }
  if (col === "status") {
    const cls = String(val).toUpperCase() === "PASS" ? "pass" : "fail";
    return `<span class="pill ${cls}">${val}</span>`;
  }
  if (col === "earnings_blackout" || col === "earnings_known") {
    const b = String(val).toLowerCase() === "true" || val === true || val === "1";
    return b ? "true" : "false";
  }
  if (NUM_COLS.has(col)) {
    const n = toNum(val);
    if (n === null) return "";
    if (col === "rr" || col === "atrs_from_entry") return n.toFixed(3);
    if (col === "dollar_vol_30d") return Math.round(n).toLocaleString();
    if (col === "avg_vol_30d" || col === "weekly_bars" || col === "days_to_earnings") return String(Math.round(n));
    if (col.endsWith("_pct")) return n.toFixed(2);
    return n.toFixed(4);
  }
  return String(val);
}

function cmpCol(a, b, col, dir) {
  if (!col) return 0;
  const av = a[col], bv = b[col];
  const an = toNum(av), bn = toNum(bv);
  if (NUM_COLS.has(col)) {
    const aEmpty = an === null;
    const bEmpty = bn === null;
    if (aEmpty && !bEmpty) return 1;
    if (!aEmpty && bEmpty) return -1;
    if (!aEmpty && !bEmpty) {
      const cmp = an - bn;
      if (cmp !== 0) return dir === "asc" ? cmp : -cmp;
    }
    return 0;
  }
  const cmp = String(av ?? "").localeCompare(String(bv ?? ""));
  if (cmp !== 0) return dir === "asc" ? cmp : -cmp;
  return 0;
}

function compareRows(a, b) {
  let c = cmpCol(a, b, sortCol, sortDir);
  if (c !== 0) return c;
  if (sortCol2 && sortCol2 !== sortCol) {
    c = cmpCol(a, b, sortCol2, sortDir2);
    if (c !== 0) return c;
  }
  const as = String(a.status).toUpperCase() === "PASS" ? 0 : 1;
  const bs = String(b.status).toUpperCase() === "PASS" ? 0 : 1;
  if (as !== bs) return as - bs;
  return String(a.ticker || "").localeCompare(String(b.ticker || ""));
}

function rowMatchesChartFilter(r) {
  if (!chartFilter) return true;
  const st = String(r.status).toUpperCase();
  if (chartFilter.type === "status") {
    return st === String(chartFilter.value).toUpperCase();
  }
  if (chartFilter.type === "reason") {
    if (st === "PASS") return false;
    return bucketReason(r.reason, r.status) === chartFilter.value;
  }
  if (chartFilter.type === "rr") {
    if (st !== "PASS") return false;
    const n = toNum(r.rr);
    if (n === null) return false;
    const bin = RR_BINS.find(b => b.label === chartFilter.value);
    if (!bin) return false;
    return n >= bin.min && n < bin.max;
  }
  return true;
}

function setChartFilter(next) {
  // Toggle off if clicking the same slice/bar again
  if (chartFilter && next && chartFilter.type === next.type && chartFilter.value === next.value) {
    chartFilter = null;
  } else {
    chartFilter = next;
  }
  // Keep status dropdown in sync for status clicks
  const sel = document.getElementById("statusFilter");
  if (chartFilter && chartFilter.type === "status") sel.value = chartFilter.value;
  else if (!chartFilter || chartFilter.type !== "status") {
    // leave dropdown alone unless it was set by chart status
  }
  updateChartFilterChip();
  renderTable();
}

function clearChartFilter() {
  chartFilter = null;
  updateChartFilterChip();
  renderTable();
}

function updateChartFilterChip() {
  const chip = document.getElementById("chartFilterChip");
  const label = document.getElementById("chartFilterLabel");
  if (!chartFilter) {
    chip.style.display = "none";
    label.textContent = "";
    return;
  }
  chip.style.display = "inline-flex";
  if (chartFilter.type === "status") label.textContent = `Filter: status = ${chartFilter.value}`;
  else if (chartFilter.type === "reason") label.textContent = `Filter: fail reason = ${chartFilter.value}`;
  else if (chartFilter.type === "rr") label.textContent = `Filter: R:R ${chartFilter.value}`;
  else label.textContent = "Chart filter";
}

function filteredRows() {
  const st = document.getElementById("statusFilter").value;
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  return allRows.filter(r => {
    if (st !== "ALL" && String(r.status).toUpperCase() !== st) return false;
    if (!rowMatchesChartFilter(r)) return false;
    if (!q) return true;
    const hay = `${r.ticker || ""} ${r.reason || ""} ${r.status || ""}`.toLowerCase();
    return hay.includes(q);
  });
}

function renderTable() {
  const rows = filteredRows().slice().sort(compareRows);
  const thead = document.querySelector("#dataTable thead");
  const tbody = document.querySelector("#dataTable tbody");
  thead.innerHTML = "<tr>" + COLS.map(c => {
    let mark = "";
    if (sortCol === c) mark = `<span class="sort">1${sortDir === "asc" ? "▲" : "▼"}</span>`;
    else if (sortCol2 === c) mark = `<span class="sort">2${sortDir2 === "asc" ? "▲" : "▼"}</span>`;
    return `<th data-col="${c}" title="Click: primary sort · Shift+click: secondary sort">${c}${mark}</th>`;
  }).join("") + "</tr>";
  tbody.innerHTML = rows.map(r => {
    const cls = String(r.status).toUpperCase() === "PASS" ? "pass" : "fail";
    return `<tr class="${cls}">` + COLS.map(c => `<td>${fmt(c, r[c], r)}</td>`).join("") + "</tr>";
  }).join("");
  thead.querySelectorAll("th").forEach(th => {
    th.addEventListener("click", (ev) => {
      const c = th.getAttribute("data-col");
      const defaultDir = (c === "rr") ? "desc" : (c === "atrs_from_entry" ? "asc" : (NUM_COLS.has(c) ? "desc" : "asc"));
      if (ev.shiftKey) {
        if (sortCol2 === c) sortDir2 = sortDir2 === "asc" ? "desc" : "asc";
        else { sortCol2 = c; sortDir2 = defaultDir; }
      } else {
        if (sortCol === c) sortDir = sortDir === "asc" ? "desc" : "asc";
        else {
          // demote previous primary to secondary when changing column
          if (sortCol && sortCol !== c) { sortCol2 = sortCol; sortDir2 = sortDir; }
          sortCol = c;
          sortDir = defaultDir;
        }
      }
      renderTable();
    });
  });
  const s2 = (sortCol2 && sortCol2 !== sortCol) ? `, then ${sortCol2} ${sortDir2}` : "";
  document.getElementById("tableMeta").textContent =
    `Showing ${rows.length} / ${allRows.length} rows · sort: ${sortCol} ${sortDir}${s2} · shift-click for 2nd`;
}

function destroyCharts() {
  Object.keys(charts).forEach(k => { if (charts[k]) { charts[k].destroy(); charts[k] = null; } });
}

function renderCharts() {
  destroyCharts();
  const nPass = allRows.filter(r => String(r.status).toUpperCase() === "PASS").length;
  const nFail = allRows.filter(r => String(r.status).toUpperCase() !== "PASS").length;
  const nBo = allRows.filter(r => {
    const v = r.earnings_blackout;
    return String(v).toLowerCase() === "true" || v === true || v === "1";
  }).length;

  document.getElementById("cScanned").textContent = allRows.length;
  document.getElementById("cPass").textContent = nPass;
  document.getElementById("cFail").textContent = nFail;
  document.getElementById("cBlackout").textContent = nBo;

  charts.status = new Chart(document.getElementById("chartStatus"), {
    type: "doughnut",
    data: {
      labels: ["PASS", "FAIL"],
      datasets: [{
        data: [nPass, nFail],
        backgroundColor: ["#3fb950", "#f85149"],
        borderWidth: 0
      }]
    },
    options: {
      plugins: { legend: { labels: { color: "#e6edf3" } } },
      maintainAspectRatio: false,
      onClick: (evt, elements) => {
        if (!elements.length) return;
        const idx = elements[0].index;
        const label = ["PASS", "FAIL"][idx];
        setChartFilter({ type: "status", value: label });
        document.getElementById("statusFilter").value = label;
      }
    }
  });

  const buckets = {};
  allRows.forEach(r => {
    const b = bucketReason(r.reason, r.status);
    if (!b) return;
    buckets[b] = (buckets[b] || 0) + 1;
  });
  const labels = ["$vol", "short float", "history", "R:R", "no retest", "earnings", "other"].filter(k => buckets[k]);
  const values = labels.map(k => buckets[k]);
  charts.reasons = new Chart(document.getElementById("chartReasons"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "FAIL count",
        data: values,
        backgroundColor: "#f78166",
        borderRadius: 6
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } },
        y: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" }, beginAtZero: true }
      },
      maintainAspectRatio: false,
      onClick: (evt, elements) => {
        if (!elements.length) return;
        const idx = elements[0].index;
        setChartFilter({ type: "reason", value: labels[idx] });
        document.getElementById("statusFilter").value = "FAIL";
      }
    }
  });

  const rrVals = allRows
    .filter(r => String(r.status).toUpperCase() === "PASS")
    .map(r => toNum(r.rr))
    .filter(n => n !== null);
  const counts = RR_BINS.map(bin => rrVals.filter(v => v >= bin.min && v < bin.max).length);
  const binLabels = RR_BINS.map(b => b.label);
  charts.rr = new Chart(document.getElementById("chartRR"), {
    type: "bar",
    data: {
      labels: binLabels,
      datasets: [{
        label: "PASS count",
        data: counts,
        backgroundColor: "#58a6ff",
        borderRadius: 6
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } },
        y: { ticks: { color: "#8b949e", stepSize: 1 }, grid: { color: "#21262d" }, beginAtZero: true }
      },
      maintainAspectRatio: false,
      onClick: (evt, elements) => {
        if (!elements.length) return;
        const idx = elements[0].index;
        setChartFilter({ type: "rr", value: binLabels[idx] });
        document.getElementById("statusFilter").value = "PASS";
      }
    }
  });
}

async function loadReport(path, dateLabel) {
  document.getElementById("tableMeta").textContent = "Loading " + path + "…";
  const res = await fetch(path + "?t=" + Date.now());
  if (!res.ok) throw new Error("Failed to load " + path + " (" + res.status + ")");
  const text = await res.text();
  allRows = enrichEarningsLive(parseCSV(text));
  sortCol = "rr";
  sortDir = "desc";
  sortCol2 = "atrs_from_entry";
  sortDir2 = "asc";
  chartFilter = null;
  document.getElementById("statusFilter").value = "ALL";
  updateChartFilterChip();
  renderCharts();
  renderTable();
  document.getElementById("footerNote").textContent =
    `Report ${dateLabel} · ${allRows.length} tickers · Chart.js CDN · historical-reports/`;
}

async function init() {
  let reports = [];
  try {
    const res = await fetch("reports.json?t=" + Date.now());
    reports = await res.json();
  } catch (e) {
    reports = [{ date: "latest", file: "latest.csv", path: "historical-reports/latest.csv" }];
  }
  const sel = document.getElementById("reportSelect");
  sel.innerHTML = reports.map((r, i) =>
    `<option value="${r.path}" ${i===0?"selected":""}>${r.date}</option>`
  ).join("");
  // Prefer latest dated entry; also offer latest.csv if present via first dated
  sel.addEventListener("change", () => {
    const opt = sel.selectedOptions[0];
    loadReport(opt.value, opt.textContent).catch(err => {
      document.getElementById("tableMeta").innerHTML = `<span class="err">${err.message}</span>`;
    });
  });
  document.getElementById("statusFilter").addEventListener("change", () => {
    // Manual status change clears incompatible chart filters
    if (chartFilter && chartFilter.type === "status") {
      const v = document.getElementById("statusFilter").value;
      if (v === "ALL") chartFilter = null;
      else chartFilter = { type: "status", value: v };
      updateChartFilterChip();
    } else if (chartFilter && chartFilter.type === "reason" && document.getElementById("statusFilter").value === "PASS") {
      chartFilter = null; updateChartFilterChip();
    } else if (chartFilter && chartFilter.type === "rr" && document.getElementById("statusFilter").value === "FAIL") {
      chartFilter = null; updateChartFilterChip();
    }
    renderTable();
  });
  document.getElementById("searchBox").addEventListener("input", renderTable);
  document.getElementById("clearChartFilter").addEventListener("click", () => {
    clearChartFilter();
    document.getElementById("statusFilter").value = "ALL";
  });

  const first = reports[0];
  if (first) {
    await loadReport(first.path, first.date);
  } else {
    await loadReport("historical-reports/latest.csv", "latest");
  }
}

init().catch(err => {
  document.getElementById("tableMeta").innerHTML = `<span class="err">${err.message}</span>`;
});
</script>
</body>
</html>
